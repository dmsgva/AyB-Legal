<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AyB Video Publisher - Authorization</title>
<style>body{font-family:system-ui,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222}code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px}</style></head>
<body><h1>Authorization received</h1>
<p>Copy this code and paste it into the publishing tool. It expires in a few minutes and works only once.</p>
<code id="c">(no code)</code>
<p id="e" style="color:#b00"></p>
<script>
  // Shows the authorization code returned by TikTok. Nothing is sent or stored anywhere.
  const q = new URLSearchParams(location.search);
  if (q.get("code")) document.getElementById("c").textContent = q.get("code");
  if (q.get("error")) document.getElementById("e").textContent = "Error: " + q.get("error") + " " + (q.get("error_description") || "");
</script>
</body></html>
